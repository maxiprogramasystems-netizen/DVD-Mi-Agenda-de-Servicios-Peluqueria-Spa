<title>Mi Agenda Pro</title>
<style>
:root{--bg:#1b1220;--card:#271a2e;--card2:#31213a;--inp:#160d1b;--navbg:#120a16;--tx:#fbf4fc;--mu:#c4b0cd;--k1:#4a3556;--k2:#33233c;--kd:#170d1c;--sh1:#0008;--sh2:#0006;--a:#e8a6bd;--a1:#ffd0e2;--a2:#c97b9b;--ad:#8f4a68;--ar:232,166,189;--g:#e0bb7c;--g1:#f7e0b0;--g2:#a98445;--gd:#7d6130;--gr:224,187,124;--bt:#2a1230;--ok:#6ee7b7;--bad:#ff6b81;--font:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(15px,.45vw + 14px,19px);-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 60% at 50% -10%,rgba(var(--ar),.3) 0,var(--bg) 60%) fixed;color:var(--tx);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;line-height:1.35;display:flex;justify-content:center}
#app{width:100%;max-width:52rem;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0)}
header{padding:1rem 1.1rem .5rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
h1{font-size:1.3rem;letter-spacing:.2px}h1 small{display:block;font-size:.8rem;color:var(--mu);font-weight:400}
h3{font-size:1.1rem}
main{flex:1;overflow:auto;padding:.4rem 1rem 6.5rem;-webkit-overflow-scrolling:touch}
.btn{border:0;color:var(--bt);font-weight:700;font-size:.95rem;padding:.75rem 1.1rem;border-radius:.9rem;cursor:pointer;font-family:inherit;background:linear-gradient(180deg,var(--a1),var(--a) 55%,var(--a2));box-shadow:0 1px 0 #fff9 inset,0 -3px 0 #0003 inset,0 6px 0 var(--ad),0 12px 18px var(--sh1);transition:.08s;margin-bottom:.4rem}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #fff9 inset,0 -2px 0 #0003 inset,0 1px 0 var(--ad),0 3px 6px var(--sh1)}
.btn.gold{color:#2a1a05;background:linear-gradient(180deg,var(--g1),var(--g) 55%,var(--g2));box-shadow:0 1px 0 #fff9 inset,0 -3px 0 #0003 inset,0 6px 0 var(--gd),0 12px 18px var(--sh1)}
.btn.wa{background:linear-gradient(180deg,#7df0a8,#25d366 55%,#17994a);color:#062b14;box-shadow:0 1px 0 #fff9 inset,0 -3px 0 #0003 inset,0 6px 0 #0f6b33,0 12px 18px var(--sh1)}
.btn.dark{background:linear-gradient(180deg,var(--k1),var(--k2));color:var(--tx);box-shadow:0 1px 0 #fff3 inset,0 5px 0 var(--kd),0 10px 16px var(--sh1)}
.btn.sm{padding:.55rem .8rem;font-size:.82rem;border-radius:.7rem;box-shadow:0 1px 0 #fff9 inset,0 -2px 0 #0003 inset,0 4px 0 var(--ad),0 8px 12px var(--sh1)}
.btn.sm.wa{box-shadow:0 1px 0 #fff9 inset,0 4px 0 #0f6b33,0 8px 12px var(--sh1)}.btn.sm.gold{box-shadow:0 1px 0 #fff9 inset,0 4px 0 var(--gd),0 8px 12px var(--sh1)}.btn.sm.dark{box-shadow:0 1px 0 #fff3 inset,0 4px 0 var(--kd),0 8px 12px var(--sh1)}
.btn.full{width:100%}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid rgba(var(--ar),.4);border-radius:1.1rem;padding:.9rem;margin:0 0 .9rem;box-shadow:0 0 0 1px rgba(var(--ar),.13),0 0 18px rgba(var(--ar),.25),0 0 42px rgba(var(--ar),.12),0 10px 24px var(--sh2)}
.card.gold{border-color:rgba(var(--gr),.55);box-shadow:0 0 18px rgba(var(--gr),.22),0 0 42px rgba(var(--gr),.1),0 10px 24px var(--sh2)}
.card.bad{opacity:.55}
.row{display:flex;align-items:center;gap:.65rem}.sp{flex:1}.mu{color:var(--mu);font-size:.82rem}
.time{font-weight:800;font-size:1.1rem;color:var(--g);text-shadow:0 0 10px rgba(var(--gr),.5);min-width:6.4rem}
.gap{font-size:.72rem;color:var(--ok);text-align:center;margin:-.35rem 0 .5rem;letter-spacing:.5px}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.65rem}
input,select{width:100%;background:var(--inp);color:var(--tx);border:1px solid rgba(var(--ar),.45);border-radius:.8rem;padding:.75rem;font-size:1rem;font-family:inherit;box-shadow:0 0 12px rgba(var(--ar),.14) inset,0 0 12px rgba(var(--ar),.14);outline:none;margin-bottom:.65rem}
input:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 0 20px rgba(var(--ar),.55)}
input[type=color]{width:3.6rem;height:2.7rem;padding:.2rem;cursor:pointer;margin:0}
label{font-size:.78rem;color:var(--mu);display:block;margin:0 0 .25rem .15rem}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;gap:.3rem;padding:.6rem .6rem calc(.6rem + env(safe-area-inset-bottom,0));background:linear-gradient(0deg,var(--navbg) 72%,transparent)}
nav button{flex:1;border:0;background:var(--k2);color:var(--mu);padding:.5rem .1rem;border-radius:.9rem;font-size:.72rem;font-family:inherit;cursor:pointer;box-shadow:0 1px 0 #fff2 inset,0 4px 0 var(--kd)}
nav button{position:relative}nav button b{display:block;font-size:1.2rem}.bd{position:absolute;top:.1rem;right:20%;background:var(--bad);color:#fff;font-style:normal;font-size:.65rem;font-weight:800;border-radius:99px;min-width:1.1rem;height:1.1rem;display:grid;place-items:center;padding:0 .25rem;box-shadow:0 0 10px var(--bad)}
nav button.on{color:var(--bt);background:linear-gradient(180deg,var(--a1),var(--a));box-shadow:0 0 18px rgba(var(--ar),.6),0 4px 0 var(--ad)}
.modal{position:absolute;inset:0;background:#0009;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-height:92%;overflow:auto;background:var(--card);border-radius:1.5rem 1.5rem 0 0;padding:1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom,0));border-top:1px solid var(--a);box-shadow:0 -10px 40px rgba(var(--ar),.25)}
.err{background:#ff6b8122;border:1px solid var(--bad);color:var(--tx);border-radius:.8rem;padding:.65rem;font-size:.85rem;margin-bottom:.65rem}
.toast{position:fixed;top:calc(.7rem + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);width:min(94vw,34rem);z-index:99;background:var(--card2);border:1px solid var(--a);border-radius:1rem;padding:.8rem;box-shadow:0 0 28px rgba(var(--ar),.6),0 10px 24px var(--sh1);animation:d .35s;font-size:.92rem}
@keyframes d{from{opacity:0;margin-top:-30px}}
.slot{padding:.6rem .85rem;border-radius:.8rem;background:var(--inp);border:1px solid rgba(var(--gr),.55);color:var(--g);font-weight:700;cursor:pointer;font-family:inherit;font-size:.95rem;box-shadow:0 0 12px rgba(var(--gr),.2)}
.slot.on{background:var(--g);color:#2a1a05}
.rec{background:#fffaf2;color:#2b2230;border-radius:6px;padding:1.2rem 1.1rem;font-family:"Courier New",monospace;font-size:.85rem;box-shadow:0 12px 30px #000a;-webkit-mask:radial-gradient(circle 6px at 6px 100%,#0000 98%,#000) -6px 0/12px 100% repeat-x;mask:radial-gradient(circle 6px at 6px 100%,#0000 98%,#000) -6px 0/12px 100% repeat-x}
.rec h3{text-align:center;font-family:var(--font);letter-spacing:2px;color:#8f4a68}.rec hr{border:0;border-top:1px dashed #9a8aa0;margin:.6rem 0}.rec .l{display:flex;justify-content:space-between;margin:.25rem 0;gap:.5rem}.rec .c{text-align:center;font-size:.72rem}
.rec .rl{display:block;margin:0 auto .4rem;width:3.4rem;height:3.4rem;object-fit:contain;border-radius:.7rem}
.msg{background:#0b3b2a;color:#fbf4fc;border-radius:4px 14px 14px 14px;padding:.75rem;font-size:.9rem;line-height:1.45;margin:.5rem 0 .8rem;border:1px solid #25d36655;white-space:pre-line;word-break:break-word}
.pill{font-size:.72rem;padding:.2rem .55rem;border-radius:99px;background:#6ee7b722;color:var(--ok)}
.login{display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:1.5rem;overflow:auto;height:100%}
.av{width:2.7rem;height:2.7rem;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--a),var(--g));color:#2a1230;box-shadow:0 0 16px rgba(var(--ar),.55)}
.lg{width:2.8rem;height:2.8rem;flex:none;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}.lg.big{width:6.5rem;height:6.5rem;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.sw{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35),0 6px 10px var(--sh1);padding:0;margin:0}
.sw.on{border-color:var(--tx);box-shadow:0 0 0 3px rgba(var(--ar),.9),0 0 16px rgba(var(--ar),.8)}
.dn{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem}.dn .btn{margin:0;padding:.55rem .85rem}.dn .sp{text-align:center;font-weight:700;text-transform:capitalize}
a{color:var(--g)}
@media(min-width:760px){.modal{align-items:center;justify-content:center}.sheet{max-width:34rem;border-radius:1.5rem;border:1px solid var(--a)}main{padding-bottom:7rem}}
@media(max-height:480px) and (orientation:landscape){header{padding:.4rem 1rem}nav button b{display:inline;margin-right:.3rem}}
@media print{html,body{overflow:visible;height:auto;background:#fff}body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;width:80mm;box-shadow:none;-webkit-mask:none;mask:none}}
</style></head><body><div id="app"></div>
<script>
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const B=5,DSV={"Manicure":[60,45000],"Pedicure":[75,55000],"Diseño de uñas":[90,80000],"Cejas":[30,25000]};let SV={...DSV},NI="",IMP=null,DI=null,P=[],SENT=null,PUBH=null,ES=null,FV={},BR=ld("ma_brand",{}),TH=ld("ma_theme",{mode:"dark",pal:"rosa"});const ICON="icon-192.png",ICON5="icon-512.png";
const g=i=>document.getElementById(i),pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return iso(d)};
const lab=s=>new Date(s+"T12:00").toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});
const f=m=>pad(Math.floor(m/60))+":"+pad(m%60),$=n=>"$"+n.toLocaleString("es-CO");
let AC=ld("ma_acc",[]),U=null,T=[],D=today(),tab="ag",modal=null,q="",err="",PS=null,PV="Manicure",PD=today(),LS="Manicure";
const save=()=>localStorage.setItem("ma_t_"+U.id,JSON.stringify(T));
const nid=()=>Math.max(0,...T.map(t=>t.id))+1;
/* ---- Reglas de agenda: cada turno bloquea su duración + 5 min ---- */
const L=(dt,id)=>T.filter(t=>t.dt===dt&&t.st!=="x"&&t.id!==id).map(t=>[t.s,t.s+t.d,t]);
const hit=(l,s,d)=>l.find(b=>s<b[1]+B&&s+d+B>b[0]);
const nextFree=(l,s,d)=>{for(let x=s;x+d<=1320;x+=5)if(!hit(l,x,d))return x;return null};
const slots=(l,d,dt)=>{const n=new Date(),a=[];let st=480;if(dt===today())st=Math.max(st,Math.ceil((n.getHours()*60+n.getMinutes()+1)/15)*15);for(let x=st;x+d<=1080;x+=15)if(!hit(l,x,d))a.push(x);return a};
const msgWA=t=>`Hola ${t.n.split(" ")[0]} 🌸\nTe saludamos de ${bn()}. Tu cita de ${t.sv} quedó agendada para el ${lab(t.dt)} a las ${f(t.s)} (hasta las ${f(t.s+t.d)}).\nTe esperamos con mucho gusto. Si necesitas cambiarla, escríbenos con confianza 💕`;
const wa=(ph,m)=>"https://wa.me/"+ph+"?text="+encodeURIComponent(m);
/* ---- Cuentas ---- */
function crear(){const n=g("nm").value.trim(),b=g("bz").value.trim(),p=g("ph").value.replace(/\D/g,"");if(!n||!b||p.length<8){err="Completa tu nombre, el negocio y tu WhatsApp con indicativo (ej. 573001234567).";return R()}
const a={id:"u"+Date.now(),n,biz:b,ph:p,pin:g("pn").value.trim(),role:"owner",img:NI};NI="";localStorage.setItem("ma_sv_"+a.id,JSON.stringify(SV));AC.push(a);localStorage.setItem("ma_acc",JSON.stringify(AC));if(!BR.name){BR.name=b;savBR()}err="";entrar(a.id,1)}
function entrar(id,nuevo){const a=AC.find(x=>x.id===id);if(a.pin&&!nuevo&&prompt("PIN de "+a.n)!==a.pin)return;U=a;T=ld("ma_t_"+id,[]);P=ld("ma_p_"+id,[]);{const o=ld("ma_p__",[]);if(o.length){P.push(...o);localStorage.removeItem("ma_p__");savP()}}ensureTopic();SV=ld("ma_sv_"+id,{...DSV});D=today();tab="ag";pedir();sse();R()}
function salir(){U=null;try{ES&&ES.close()}catch(e){}ES=null;R()}
/* ---- Notificaciones ---- */
function pedir(){try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission().then(R)}catch(e){}}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),v=c.createGain();o.connect(v);v.connect(c.destination);o.frequency.value=880;v.gain.value=.15;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function ping(m){toastMsg(m);beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
try{if("Notification"in window&&Notification.permission==="granted"){if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification("Mi Agenda",{body:m,icon:"icon-192.png",badge:"icon-192.png",vibrate:[200,100,200],tag:"ma"+Date.now()}));else new Notification("Mi Agenda",{body:m,icon:"icon-192.png"})}}catch(e){}}
function chk(){if(!U)return;const n=new Date(),dt=today(),m=n.getHours()*60+n.getMinutes(),F=ld("ma_f",{});
T.filter(t=>t.dt===dt&&t.st!=="x").forEach(t=>[[t.s-5,"i",`⏰ En 5 minutos inicia el turno de ${t.n} (${t.sv}).`],[t.s+t.d-5,"f",`⏳ Faltan 5 minutos para terminar el turno de ${t.n}. Tu siguiente turno tiene 5 min de margen.`]].forEach(([at,k,msg])=>{const key=dt+t.id+k+t.s;if(m>=at&&m<at+3&&!F[key]){F[key]=1;ping(msg)}}));
localStorage.setItem("ma_f",JSON.stringify(F))}
setInterval(chk,15000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()});
function toastMsg(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}
/* ---- Pantallas ---- */
function R(){const A=g("app");if(PUBH||location.hash.startsWith("#r="))return pub(A);
if(!U){A.innerHTML=`<div class="login">${ban()}<div class="row" style="justify-content:center"><img class="lg big" src="${BR.logo||ICON5}" alt=""></div><h1 style="text-align:center;font-size:1.8rem">${esc(BR.name||"Mi Agenda Pro")}<small>${AC.length?"Elige tu cuenta":"Crea tu cuenta para empezar"}</small></h1><br>${AC.map(a=>`<div class="card row" onclick="entrar('${a.id}')" style="cursor:pointer">${av(a)}<div><b>${esc(a.n)}</b><div class="mu">${esc(a.biz)}${a.role==="worker"?" · equipo":""}</div></div><div class="sp"></div>${a.pin?'<span class="pill">PIN</span>':""}</div>`).join("")}
${AC.length?`<p class="mu" style="text-align:center">Para agregar usuarios o trabajadoras entra a Ajustes.</p>`:`<div class="card gold"><b>Crea tu cuenta</b><br><br><div class="row" style="margin-bottom:.7rem"><div class="av" id="npv">📷</div><label class="btn sm dark" style="display:inline-block;margin:0;width:auto">Foto<input type="file" accept="image/*" hidden onchange="foto(this,'new')"></label></div>${err?`<div class="err">${err}</div>`:""}<label>Tu nombre</label><input id="nm" autocomplete="name"><label>Nombre del negocio</label><input id="bz"><label>Tu WhatsApp (con indicativo)</label><input id="ph" inputmode="numeric" placeholder="573001234567"><label>PIN opcional</label><input id="pn" inputmode="numeric" maxlength="6" type="password"><button class="btn full" onclick="crear()">Crear cuenta</button></div>`}<p class="mu" style="text-align:center">Funciona con y sin internet. Tus datos se guardan en este dispositivo.</p>${modal&&modal.k==="ins"?M():""}</div>`;return}
let body="";const live=T.filter(t=>t.dt===D&&t.st!=="x").sort((a,b)=>a.s-b.s);
if(tab==="ag"){body=PEND()+`<div class="dn"><button class="btn dark" onclick="D=addD(D,-1);R()">‹</button><div class="sp">${lab(D)}</div><button class="btn dark" onclick="D=addD(D,1);R()">›</button></div><div class="row" style="margin-bottom:.8rem"><div class="mu">${live.length} turnos · ${$(live.reduce((a,t)=>a+t.p,0))}</div><div class="sp"></div>${D!==today()?`<button class="btn sm dark" onclick="D=today();R()">Hoy</button>`:""}</div>`;
live.forEach((t,i)=>{const p=live[i-1];if(p)body+=`<div class="gap">╌ pausa de ${t.s-(p.s+p.d)} min ╌</div>`;
body+=`<div class="card"><div class="row"><div class="time">${f(t.s)}–${f(t.s+t.d)}</div><div><b>${esc(t.n)}</b> ${t.paid?'<span class="pill">Pagado</span>':""}<div class="mu">${esc(t.sv)} · ${$(t.p)}</div></div></div><div class="chips"><button class="btn sm wa" onclick="modal={k:'wa',t:${t.id}};R()">WhatsApp</button><button class="btn sm gold" onclick="modal={k:'rec',t:${t.id}};R()">Comprobante</button><button class="btn sm dark" onclick="modal={k:'ed',t:${t.id}};R()">Editar</button></div></div>`});
if(!live.length)body+=`<p class="mu" style="text-align:center;margin:1.5rem 0">Sin turnos para este día.</p>`;
T.filter(t=>t.dt===D&&t.st==="x").forEach(t=>body+=`<div class="card bad"><s>${f(t.s)} ${esc(t.n)}</s> <span class="mu">· cancelado, horario liberado</span></div>`);
body+=`<button class="btn full" onclick="modal={k:'new'};R()">+ Nuevo turno</button>`}
if(tab==="cl"){const all=[...new Map([...T].sort((a,b)=>a.dt<b.dt?-1:1).map(t=>[t.n.toLowerCase(),t])).values()].filter(t=>(t.n+t.sv+t.ph).toLowerCase().includes(q.toLowerCase()));
body=`<input id="q" placeholder="🔍 Buscar por nombre, teléfono o servicio" value="${esc(q)}" oninput="q=this.value;R();const i=g('q');i.focus();i.setSelectionRange(99,99)">`+(all.map(t=>`<div class="card gold"><div class="row"><div class="av">${esc(t.n[0])}</div><div><b>${esc(t.n)}</b><div class="mu">+${esc(t.ph)} · ${esc(t.sv)}</div></div><div class="sp"></div><button class="btn sm wa" onclick="modal={k:'wa',t:${t.id}};R()">💬</button></div><div class="mu" style="margin-top:.5rem">Visitas: ${T.filter(x=>x.n.toLowerCase()===t.n.toLowerCase()&&x.st!=="x").length} · Último turno: ${lab(t.dt)}</div></div>`).join("")||`<p class="mu">Aún no hay clientes${q?" con esa búsqueda":""}.</p>`)}
